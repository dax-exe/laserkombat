name: Build web version

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install and activate Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Compile to WebAssembly
        # No Asyncify here anymore - main.cpp's own loop now uses
        # emscripten_set_main_loop() directly (see the source change),
        # which needs no blocking-call transformation at all, so
        # Asyncify's overhead (and the uncertainty around whether it was
        # correctly hooking into this specific game's loop, which two
        # rounds of tuning it didn't resolve) is no longer needed.
        run: |
          mkdir build-web
          cd build-web
          em++ ../src/*.cpp -o laserkombat.js \
            -I../include \
            -std=c++17 -fpermissive \
            -s USE_SDL=2 -s USE_SDL_TTF=2 \
            -s ALLOW_MEMORY_GROWTH=1 \
            --preload-file ../assets@assets \
            -O2

      - name: Upload the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: laserkombat-web-build
          path: |
            build-web/laserkombat.js
            build-web/laserkombat.wasm
            build-web/laserkombat.data
