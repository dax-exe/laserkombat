name: Build web version

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install and activate Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Compile to WebAssembly
        # ASYNCIFY: Laser Kombat, like any native SDL2 game, runs a
        # traditional blocking main loop (handle input, update, render,
        # repeat) - fine as a normal desktop program with its own OS
        # thread, but a browser tab only has one thread for everything,
        # so code that never returns control freezes the whole page, not
        # just the game (confirmed directly - this is what was happening
        # without this flag). Asyncify transforms the compiled output so
        # blocking calls can pause and hand control back to the browser
        # between iterations, without needing to rewrite the game's own
        # C++ source to use Emscripten's alternative main-loop API.
        #
        # ASYNCIFY_STACK_SIZE: Asyncify's default stack size is quite
        # small, and real C++ programs with any meaningful call depth
        # (game logic -> rendering -> SDL internals) commonly exceed it -
        # when that happens, the unwind/rewind Asyncify needs to actually
        # resume execution can fail silently in some configurations,
        # rather than throwing a clear error. Confirmed directly: with
        # the default size, the game reached the point of calling
        # main() and then produced no further output or rendering at
        # all, no crash, no freeze - consistent with exactly this.
        # Bumped well above the default as a generous margin.
        run: |
          mkdir build-web
          cd build-web
          em++ ../src/*.cpp -o laserkombat.js \
            -I../include \
            -std=c++17 -fpermissive \
            -s USE_SDL=2 -s USE_SDL_TTF=2 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s ASYNCIFY=1 \
            -s ASYNCIFY_STACK_SIZE=131072 \
            --preload-file ../assets@assets \
            -O2

      - name: Upload the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: laserkombat-web-build
          path: |
            build-web/laserkombat.js
            build-web/laserkombat.wasm
            build-web/laserkombat.data
